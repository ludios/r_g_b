<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="darkreader-lock" />
		<meta name="format-detection" content="telephone=no">
		<meta name="referrer" content="no-referrer">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta property="og:title" content="r_g_b.html">
		<meta property="og:type" content="website">
		<meta property="og:description" content="[content note: can produce strobe effects]">
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<script>
			// A saved theme override goes on before the first paint, so a dark override never
			// flashes light. The key is src/lib/theme.svelte.ts's STORAGE_KEY.
			try {
				var theme = localStorage.getItem("r_g_b-theme");
				if (theme === "light" || theme === "dark") {
					document.documentElement.dataset.theme = theme;
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
